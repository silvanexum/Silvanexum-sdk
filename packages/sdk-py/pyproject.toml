[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silvanexum"
version = "0.3.0"
description = "Official Python SDK for Silvanexum — the spend-control plane for AI agents. Meter, attribute, cap, and audit agent spend across a multi-agent mesh, on any model or rail. Typed pydantic models generated from the API's Zod contracts."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Silvanexum" }]
keywords = ["silvanexum", "agents", "ai", "llm", "sdk", "finops", "cost", "spend", "observability", "budget"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://docs.silvanexum.com"
Documentation = "https://docs.silvanexum.com"
Repository = "https://github.com/silvanexum/Silvanexum-sdk"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["silvanexum"]

[tool.hatch.build.targets.sdist]
include = ["silvanexum", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly (ruff's classic defaults + import sorting) so a new
# ruff release can't silently widen the defaults and break CI.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
